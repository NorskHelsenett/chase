{{- if .Values.chase.auth.generateSecretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: chase-api-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
data:
  # Generate the master API key once, on install. On upgrade, reuse the value
  # already in the cluster so `helm upgrade` doesn't silently rotate it (and
  # 401 every client holding the old key). lookup returns nothing during
  # `helm template`/--dry-run, which then renders a fresh random value.
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace "chase-api-secret") }}
  {{- if and $existing $existing.data (index $existing.data "secretKey") }}
  secretKey: {{ index $existing.data "secretKey" | quote }}
  {{- else }}
  secretKey: {{ randAlphaNum 35 | b64enc | quote }}
  {{- end }}
{{- end }}
